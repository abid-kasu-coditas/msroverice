spring.application.name=client-onboarding-service
server.port=8090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/electricity_distribution
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

employee.service.url=${EMPLOYEE_SERVICE_URL:http://localhost:8091}

# Logging
logging.level.root=INFO
logging.level.com.eps=DEBUG
