spring.application.name=employee-service
server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/employee_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
internal.service.token=${INTERNAL_SERVICE_TOKEN:internal-service-token}

logging.level.root=INFO
logging.level.com.eps=DEBUG
