spring.application.name=auth-service
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Configuration (for testing)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=mySecretKeyForElectricityDistributionPlatformThatIsLongEnoughForHS256Algorithm
jwt.expiration=86400000
jwt.refresh.expiration=604800000
internal.service.token=${INTERNAL_SERVICE_TOKEN:internal-service-token}

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.eps=DEBUG
