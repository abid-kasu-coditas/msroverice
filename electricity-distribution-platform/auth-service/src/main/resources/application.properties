spring.application.name=auth-service
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/epsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=always

# H2 Configuration (for testing)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=mySecretKeyForElectricityDistributionPlatformThatIsLongEnoughForHS256Algorithm
jwt.expiration=86400000
jwt.refresh.expiration=604800000
internal.service.token=${INTERNAL_SERVICE_TOKEN:internal-service-token}

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.eps=DEBUG
