version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eps-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - eps-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eps-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - eps-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eps-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - eps-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: eps-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - customer-service
      - connection-service
      - meter-service
      - billing-service
      - payment-service
      - complaint-service
      - notification-service
      - audit-service
      - client-onboarding-service
      - employee-service
      - analytics-service
    networks:
      - eps-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: eps-auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      INTERNAL_SERVICE_TOKEN: internal-service-token
    networks:
      - eps-network

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: eps-customer-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SERVICE_URL: http://payment-service:8086
    networks:
      - eps-network

  connection-service:
    build:
      context: ./connection-service
      dockerfile: Dockerfile
    container_name: eps-connection-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/connection_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PAYMENT_SERVICE_URL: http://payment-service:8086
    networks:
      - eps-network

  meter-service:
    build:
      context: ./meter-service
      dockerfile: Dockerfile
    container_name: eps-meter-service
    ports:
      - "8084:8084"
      - "9084:9084"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meter_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - eps-network

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: eps-billing-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      meter-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      METER_SERVICE_URL: http://meter-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8086
    networks:
      - eps-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: eps-payment-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BILLING_SERVICE_URL: http://billing-service:8085
    networks:
      - eps-network

  complaint-service:
    build:
      context: ./complaint-service
      dockerfile: Dockerfile
    container_name: eps-complaint-service
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      employee-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/complaint_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMPLOYEE_SERVICE_URL: http://employee-service:8091
    networks:
      - eps-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: eps-notification-service
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - eps-network

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: eps-audit-service
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - eps-network

  client-onboarding-service:
    build:
      context: ./client-onboarding-service
      dockerfile: Dockerfile
    container_name: eps-client-onboarding-service
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/electricity_distribution
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EMPLOYEE_SERVICE_URL: http://employee-service:8091
    networks:
      - eps-network

  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile
    container_name: eps-employee-service
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employee_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      INTERNAL_SERVICE_TOKEN: internal-service-token
    networks:
      - eps-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: eps-analytics-service
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - eps-network

volumes:
  postgres_data:

networks:
  eps-network:
    driver: bridge
