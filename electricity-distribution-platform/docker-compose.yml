version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eps-postgres
    environment:
      POSTGRES_DB: epsdb
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  kafka:
    image: bitnami/kafka:3.7
    container_name: eps-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"

  redis:
    image: redis:7
    container_name: eps-redis
    ports:
      - "6379:6379"

  api-gateway:
    build: ./api-gateway
    ports:
      - "4004:4004"
    environment:
      SPRING_REDIS_HOST: redis
    depends_on:
      - auth-service
      - redis

  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_SCHEMAS: public
      SPRING_SQL_INIT_MODE: always
    depends_on:
      - postgres

  platform-service:
    build: ./platform-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  tenant-provisioning-service:
    build: ./tenant-provisioning-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  geography-service:
    build: ./geography-service
    ports:
      - "8087:8087"
      - "9087:9087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres

  tenant-user-service:
    build: ./tenant-user-service
    ports:
      - "8088:8088"
      - "9088:9088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      - postgres

  customer-service:
    build: ./customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_SERVICE_URL: http://payment-service:8093
    depends_on:
      - postgres
      - kafka

  meter-service:
    build: ./meter-service
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      - postgres

  meter-reading-service:
    build: ./meter-reading-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9090
    depends_on:
      - postgres
      - billing-service

  billing-service:
    build: ./billing-service
    ports:
      - "8090:8090"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METER_SERVICE_URL: http://meter-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8093
    depends_on:
      - postgres
      - kafka
      - meter-service

  platform-billing-service:
    build: ./platform-billing-service
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - kafka
      - redis

  complaint-service:
    build: ./complaint-service
    ports:
      - "8092:8092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TENANT_USER_SERVICE_ADDRESS: tenant-user-service
      TENANT_USER_SERVICE_GRPC_PORT: 9088
      EMPLOYEE_SERVICE_URL: http://tenant-user-service:8088
    depends_on:
      - postgres
      - kafka
      - tenant-user-service

  payment-service:
    build: ./payment-service
    ports:
      - "8093:8093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_URL: http://billing-service:8090
    depends_on:
      - postgres
      - kafka

  notification-service:
    build: ./notification-service
    ports:
      - "8094:8094"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  analytics-service:
    build: ./analytics-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epsdb
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

volumes:
  pg_data:
