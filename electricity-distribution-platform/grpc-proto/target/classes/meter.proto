syntax = "proto3";

package eps.meter;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.eps.grpc.meter";
option java_outer_classname = "MeterProto";

service MeterGrpcService {
  rpc GetConnectionDetails (ConnectionRequest) returns (ConnectionResponse);
  rpc GetMeterTypeRate (common.IdRequest) returns (MeterTypeResponse);
}

message ConnectionRequest {
  int64 connection_id = 1;
  string tenant_id = 2;
}

message ConnectionResponse {
  int64 connection_id = 1;
  int64 customer_id = 2;
  int64 meter_id = 3;
  int64 meter_type_id = 4;
  string account_number = 5;
  string status = 6;
}

message MeterTypeResponse {
  int64 id = 1;
  string code = 2;
  string name = 3;
  double rate_per_unit = 4;
}
