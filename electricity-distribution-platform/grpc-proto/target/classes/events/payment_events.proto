syntax = "proto3";

package eps.events.payment;

option java_multiple_files = true;
option java_package = "com.eps.grpc.events.payment";
option java_outer_classname = "PaymentEventsProto";

message PaymentReceivedEvent {
  string event_id = 1;
  string tenant_code = 2;
  int64 payment_id = 3;
  int64 bill_id = 4;
  int64 customer_id = 5;
  double amount = 6;
  string received_at = 7;
}
