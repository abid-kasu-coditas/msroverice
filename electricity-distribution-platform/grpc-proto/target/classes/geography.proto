syntax = "proto3";

package eps.geography;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.eps.grpc.geography";
option java_outer_classname = "GeographyProto";

service GeographyService {
  rpc GetAreaById (common.IdRequest) returns (AreaResponse);
  rpc GetCityById (common.IdRequest) returns (CityResponse);
  rpc ValidateArea (common.IdRequest) returns (common.ValidateResponse);
}

message AreaResponse {
  int64 id = 1;
  int64 city_id = 2;
  string name = 3;
  string pincode = 4;
}

message CityResponse {
  int64 id = 1;
  int64 district_id = 2;
  string name = 3;
}
